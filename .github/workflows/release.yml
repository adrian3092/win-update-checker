name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0). Leave blank when building from a tag.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } elseif ('${{ inputs.version }}') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '0.0.0-ci'
          }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            installer\setup.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          $files = @(
            'UpdateChecker.ps1',
            'Run.bat',
            'Run-Console.bat',
            'README.md',
            'LICENSE',
            'CHANGELOG.md'
          )
          $zip = "dist\WinUpdateChecker-portable-${{ steps.ver.outputs.version }}.zip"
          Compress-Archive -Path $files -DestinationPath $zip -Force
          Write-Host "Built: $zip"

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem -File -Include *.exe,*.zip -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ASCII
          Get-Content SHA256SUMS.txt
          Pop-Location

      # ----------------------------------------------------------------------
      # OPTIONAL: SignPath integration. Uncomment after your project is
      # accepted at https://signpath.io/ and you have an artifact-config GUID.
      # ----------------------------------------------------------------------
      # - name: Submit signing request
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<your-org-id>'
      #     project-slug: 'win-update-checker'
      #     signing-policy-slug: 'release-signing'
      #     artifact-configuration-slug: 'installer'
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: 'dist-signed'
      # ----------------------------------------------------------------------

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinUpdateChecker-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinUpdateChecker-Setup-${{ steps.ver.outputs.version }}.exe
            dist/WinUpdateChecker-portable-${{ steps.ver.outputs.version }}.zip
            dist/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
